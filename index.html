<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0B0F">
<title>Тренировки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&display=swap">
<style>
:root{--bg:#0B0B0F;--s:#15161C;--b:#22242D;--t:#F4F4F7;--m:#9CA0B0;--p:#FF9DF4;--g:linear-gradient(180deg,#E1ABEE 26%,#FFE6CD 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font-family:Onest,system-ui,sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--p);outline-offset:2px}
#app{max-width:480px;height:100%;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 0;display:flex;flex-direction:column;gap:14px}
.main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;scrollbar-width:none;padding-bottom:12px}
.main::-webkit-scrollbar{display:none}
.card{background:var(--s);border:1px solid var(--b);border-radius:28px}
.m{color:var(--m);font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:38px;font-weight:800;letter-spacing:-1.5px}
.dy{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.dy i{width:100%;height:6px;border-radius:3px}
.dy b{font-size:12px}
.hero{color:#0B0B0F;border-radius:32px;padding:22px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,#995283,#FFFBF8)}
.hero h1{font-size:60px;line-height:1;letter-spacing:-2px;margin-top:6px}
.chip{align-self:flex-start;padding:6px 12px;border-radius:14px;background:#0B0B0F22;font-weight:700;font-size:13px}
.btn{height:56px;width:100%;border:0;border-radius:28px;background:var(--g);color:#0B0B0F;font-size:17px;font-weight:800}
.btn.dk{background:#0B0B0F;color:var(--t);margin-top:14px}
.bn{flex:1;padding:16px 18px}
.bn b{display:block;font-size:26px;letter-spacing:-1px}
.bn span{color:var(--m);font-size:13px}
.rw{display:flex;align-items:center;gap:14px;min-height:52px;border-top:1px solid var(--b)}
.rw .i{width:24px;color:var(--m);font-weight:700}
.rw .n{flex:1}
.rw .n b{display:block;font-size:16px}
.rw .n span{color:var(--m);font-size:13px}
.pill{height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--b);background:var(--s);font-size:14px;font-weight:700}
.pill.on{background:var(--g);color:#0B0B0F;border:0}
.ic{width:44px;height:44px;border-radius:22px;border:1px solid var(--b);background:var(--s);font-size:20px}
.sg{flex:1;display:flex;gap:6px}
.sg span{flex:1;height:6px;border-radius:3px}
.ring{position:relative;width:180px;height:180px;align-self:center;flex:none}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rc #rt{font-size:46px;font-weight:800;letter-spacing:-2px}
.stp{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.stp output{font-size:48px;font-weight:800;letter-spacing:-2px;line-height:1}
.stp button{width:48px;height:48px;border-radius:24px;border:1px solid var(--b);background:var(--b);font-size:24px;font-weight:700}
.sc{padding:4px;gap:4px;display:flex;border-radius:30px}
.sc .pill{flex:1;border:0;background:none;color:var(--m)}
.sc .pill.on{color:#0B0B0F;background:var(--g)}
.bars{display:flex;gap:8px;align-items:flex-end;height:140px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%}
.bars i{width:100%;border-radius:12px;background:#2A2D38;min-height:4px}
.bars span{font-size:11px;color:var(--m);white-space:nowrap}
nav{display:flex;gap:4px;padding:6px;margin:0 -4px calc(12px + env(safe-area-inset-bottom));border-radius:36px;background:var(--s);border:1px solid var(--b);flex:none}
nav button{flex:1;height:48px;border:0;border-radius:24px;background:none;color:var(--m);font-size:13px;font-weight:700}
nav button.on{background:var(--g);color:#0B0B0F}
.gl{background:var(--g);color:#0B0B0F}
.bot{margin-top:auto;margin-bottom:calc(20px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div id="app"></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#0B0B0F'); tg.setBackgroundColor('#0B0B0F'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
}
const hap = k => { try { k === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} };
const ask = (t, f) => { try { tg.showConfirm(t, ok => ok && f()); } catch (e) { if (confirm(t)) f(); } };

// Программа: [название, подходов, повторов, рабочий вес по умолчанию]
const PROG = [
  { name: 'Push', info: 'Грудь, плечи, трицепс', ex: [['Жим лёжа', 4, '6–8', 80], ['Жим гантелей, наклон', 3, '8–10', 30], ['Жим стоя', 3, '8', 45], ['Разводка в кроссовере', 3, '12', 15], ['Французский жим', 3, '10', 30]] },
  { name: 'Pull', info: 'Спина, бицепс', ex: [['Тяга штанги в наклоне', 4, '8', 60], ['Тяга верхнего блока', 3, '10', 55], ['Тяга гантели', 3, '10', 30], ['Face pull', 3, '15', 20], ['Подъём на бицепс', 3, '10', 14]] },
  { name: 'Legs', info: 'Ноги, ягодицы', ex: [['Присед', 4, '6', 100], ['Румынская тяга', 3, '8', 80], ['Жим ногами', 3, '10', 140], ['Сгибание ног', 3, '12', 40], ['Подъём на носки', 4, '15', 60]] }
];
const DN = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const MS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const P = '#FF9DF4';

let S; try { S = JSON.parse(localStorage.getItem('fit')); } catch (e) {}
S = S || { h: [], n: 0, w: {} };
const save = () => { try { localStorage.setItem('fit', JSON.stringify(S)); } catch (e) {} };

let scr = 'home', tab = 'home', per = 'w', W = null, sel = null, sum = null;
const curDay = () => sel == null ? S.n : sel;
const num = x => String(x).replace('.', ',');
const fmt = v => v >= 1000 ? (v / 1000).toFixed(1).replace('.', ',') + ' т' : Math.round(v) + ' кг';
const D0 = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d; };
const mon = t => { const d = D0(t); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; };
const lastOf = n => { for (let i = S.h.length - 1; i >= 0; i--) { const s = [...S.h[i].sets].reverse().find(x => x.n === n); if (s) return s; } };

function buckets(p) {
  const now = new Date(), o = [];
  if (p === 'w') {
    const m = mon(now);
    for (let i = 5; i >= 0; i--) { const a = new Date(m); a.setDate(a.getDate() - 7 * i); const b = new Date(a); b.setDate(b.getDate() + 7); o.push([a, b, a.getDate() + '.' + String(a.getMonth() + 1).padStart(2, '0')]); }
  } else {
    const n = p === 'm' ? 6 : 12;
    for (let i = n - 1; i >= 0; i--) { const a = new Date(now.getFullYear(), now.getMonth() - i, 1), b = new Date(now.getFullYear(), now.getMonth() - i + 1, 1); o.push([a, b, MS[a.getMonth()]]); }
  }
  return o.map(([a, b, l]) => { const hs = S.h.filter(h => h.t >= a && h.t < b); return { l, v: hs.reduce((s, h) => s + h.v, 0), c: hs.length }; });
}

const navH = () => '<nav>' + [['home', 'Сегодня'], ['plan', 'План'], ['prog', 'Прогресс'], ['me', 'Профиль']].map(([k, t]) => `<button data-a="tab" data-v="${k}" class="${tab === k ? 'on' : ''}">${t}</button>`).join('') + '</nav>';

function exRows(d) {
  return d.ex.map((e, i) => `<div class="rw"><span class="i">0${i + 1}</span><div class="n"><b>${e[0]}</b><span>${e[1]} × ${e[2]}</span></div><b>${num(S.w[e[0]] != null ? S.w[e[0]] : e[3])} кг</b></div>`).join('');
}

function home() {
  const d = PROG[curDay()], m = mon(Date.now()), td = D0(Date.now()).getTime();
  const strip = DN.map((l, i) => { const a = new Date(m); a.setDate(a.getDate() + i); const t = a.getTime(), dn = S.h.some(h => D0(h.t).getTime() === t); return `<div class="dy"><i style="background:${dn ? P : t === td ? '#F4F4F7' : 'var(--b)'}"></i><b style="color:${t === td ? '#F4F4F7' : 'var(--m)'}">${l}</b></div>`; }).join('');
  const bk = buckets('w'), w = bk[5];
  return `<div class="row" style="gap:6px">${strip}</div>
  <div class="hero"><span class="chip">${sel == null ? 'Следующая' : 'Выбрана'} · ${d.ex.length} упражнений</span><h1>${d.name}</h1><div style="font-size:16px;font-weight:500">${d.info}</div><button class="btn dk" data-a="start">Начать тренировку →</button></div>
  <div class="row" style="gap:10px"><div class="card bn"><b>${w.c}</b><span>тренировок за неделю</span></div><div class="card bn"><b>${fmt(w.v)}</b><span>тоннаж за неделю</span></div></div>
  <div><div style="font-weight:800;font-size:18px;margin:2px 0 6px">План</div>${exRows(d)}</div>`;
}

function plan() {
  return `<h1>План</h1><div class="m" style="margin-top:-8px">Выбери день — он станет тренировкой на главном экране</div>` + PROG.map((d, i) => `<div class="card" style="padding:18px"><div class="sp"><div><b style="font-size:24px">${d.name}</b><div class="m">${d.info}</div></div><button class="pill ${i === curDay() ? 'on' : ''}" data-a="pick" data-v="${i}">${i === curDay() ? 'Выбрано' : 'Выбрать'}</button></div><div class="m" style="margin-top:10px;line-height:1.5">${d.ex.map(e => e[0]).join(', ')}</div></div>`).join('');
}

function prog() {
  const bk = buckets(per), l = bk[bk.length - 1], pv = bk[bk.length - 2], mx = Math.max(...bk.map(b => b.v), 1);
  const dl = pv.v > 0 ? Math.round((l.v / pv.v - 1) * 100) : null;
  const pr = {};
  S.h.forEach(h => h.sets.forEach(s => { const c = pr[s.n]; if (!c || s.w > c.w || (s.w === c.w && s.r > c.r)) pr[s.n] = s; }));
  const prs = Object.values(pr).sort((a, b) => b.w - a.w).slice(0, 4);
  return `<h1>Прогресс</h1>
  <div class="card sc">${[['w', 'Недели'], ['m', 'Месяцы'], ['y', 'Год']].map(([k, t]) => `<button class="pill ${per === k ? 'on' : ''}" data-a="per" data-v="${k}">${t}</button>`).join('')}</div>
  <div class="card" style="padding:20px"><div class="m">${per === 'w' ? 'Тоннаж за неделю' : 'Тоннаж за месяц'}</div>
  <div class="row" style="align-items:baseline;gap:10px;margin:2px 0 16px"><span style="font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1">${fmt(l.v)}</span>${dl === null ? '' : `<span class="chip gl" style="padding:4px 10px">${dl > 0 ? '+' : ''}${dl}%</span>`}</div>
  <div class="bars">${bk.map((b, i) => `<div><i style="height:${Math.max(4, b.v / mx * 100)}px;${i === bk.length - 1 ? 'background:' + P : ''}"></i><span>${b.l}</span></div>`).join('')}</div></div>
  <div class="row" style="gap:10px"><div class="card bn"><b>${l.c}</b><span>тренировок</span></div><div class="card bn"><b>${S.h.length}</b><span>всего тренировок</span></div></div>
  <div class="card" style="padding:14px 18px 6px"><div style="font-weight:800;margin-bottom:6px">Личные рекорды</div>${prs.length ? prs.map(s => `<div class="rw" style="min-height:44px"><span class="n" style="font-weight:700">${s.n}</span><b style="color:${P}">${num(s.w)} кг × ${s.r}</b></div>`).join('') : '<div class="m" style="padding:6px 0 14px">Завершите первую тренировку — здесь появятся рекорды и графики. Чтобы посмотреть, как всё выглядит, заполните демо-данные в профиле.</div>'}</div>`;
}

function me() {
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user, tot = S.h.reduce((a, h) => a + h.v, 0);
  return `<h1>${u && u.first_name ? u.first_name : 'Профиль'}</h1>
  <div class="row" style="gap:10px"><div class="card bn"><b>${S.h.length}</b><span>тренировок</span></div><div class="card bn"><b>${fmt(tot)}</b><span>общий тоннаж</span></div></div>
  <button class="pill" data-a="seed" style="height:52px">Заполнить демо-данными</button>
  <button class="pill" data-a="reset" style="height:52px">Сбросить все данные</button>`;
}

function stp(l, v, a, d) {
  return `<div class="stp"><span class="m" style="font-size:13px">${l}</span><output>${v}</output><div class="row" style="gap:10px"><button data-a="${a}" data-v="-${d}" aria-label="Меньше">−</button><button data-a="${a}" data-v="${d}" aria-label="Больше">+</button></div></div>`;
}

function work() {
  const d = PROG[W.d], e = d.ex[W.i], cl = W.log.filter(s => s.n === e[0]), l = lastOf(e[0]);
  return `<div class="row" style="gap:14px"><button class="ic" data-a="back" aria-label="Назад">←</button><div class="sg">${d.ex.map((_, i) => `<span style="background:${i <= W.i ? P : 'var(--b)'}"></span>`).join('')}</div><span class="m" style="font-weight:700">${W.i + 1}/${d.ex.length}</span></div>
  <div><h1>${e[0]}</h1><div class="m">${l ? `В прошлый раз: ${num(l.w)} кг × ${l.r}` : `План: ${e[1]} × ${e[2]}`}</div></div>
  <div class="ring"><svg width="180" height="180" viewBox="0 0 180 180"><circle cx="90" cy="90" r="80" fill="none" stroke="#22242D" stroke-width="10"/><circle id="rc" cx="90" cy="90" r="80" fill="none" stroke="${P}" stroke-width="10" stroke-linecap="round" stroke-dasharray="502.65" stroke-dashoffset="0" transform="rotate(-90 90 90)"/></svg><div class="rc"><span class="m" id="rl"></span><span id="rt"></span></div></div>
  <div class="row" style="justify-content:center"><button class="pill" data-a="rs" data-v="-15">−15 с</button><button class="pill" data-a="rs" data-v="15">+15 с</button><button class="pill" data-a="skip">Пропустить</button></div>
  <div class="card" style="padding:18px"><div class="sp" style="margin-bottom:14px"><b>Подход ${cl.length + 1} из ${e[1]}</b><span class="row" style="gap:6px">${cl.slice(-3).map(s => `<span class="pill" style="height:auto;padding:6px 12px">${num(s.w)}×${s.r}</span>`).join('')}</span></div><div class="row" style="gap:0">${stp('Вес, кг', num(W.w), 'w', 2.5)}${stp('Повторы', W.r, 'r', 1)}</div></div>
  <button class="btn bot" data-a="set">Подход выполнен</button>`;
}

function doneV() {
  return `<div class="hero" style="margin-top:24px"><span class="chip">Тренировка завершена</span><h1 style="font-size:52px">${sum.d}</h1><div style="font-size:16px;font-weight:500">${fmt(sum.v)} · ${sum.s} подходов · ${sum.dur} мин</div></div>
  <div class="m" style="text-align:center">Результат сохранён. Следующая тренировка — ${PROG[S.n].name}.</div>
  <button class="btn bot" data-a="ok">Отлично</button>`;
}

function render() {
  const a = document.getElementById('app'); let h, nv = true;
  if (scr === 'work') { h = work(); nv = false; }
  else if (scr === 'done') { h = doneV(); nv = false; }
  else h = { home, plan, prog, me }[tab]();
  a.innerHTML = `<div class="main">${h}</div>` + (nv ? navH() : '');
  try { scr === 'work' ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
  tick();
}

function initSet() { const e = PROG[W.d].ex[W.i]; W.w = S.w[e[0]] != null ? S.w[e[0]] : e[3]; W.r = parseInt(e[2]); W.re = 0; }
function start(i) { W = { d: i, i: 0, log: [], t0: Date.now(), re: 0, rt: 90 }; initSet(); scr = 'work'; hap('medium'); render(); }
function doneSet() {
  const e = PROG[W.d].ex[W.i]; W.log.push({ n: e[0], w: W.w, r: W.r }); S.w[e[0]] = W.w; hap('medium');
  if (W.log.filter(s => s.n === e[0]).length >= e[1]) {
    if (W.i === PROG[W.d].ex.length - 1) return finish();
    W.i++; initSet();
  }
  W.re = Date.now() + 90000; W.rt = 90;
}
function finish() {
  const v = W.log.reduce((a, s) => a + s.w * s.r, 0);
  sum = { t: Date.now(), d: PROG[W.d].name, v, s: W.log.length, dur: Math.max(1, Math.round((Date.now() - W.t0) / 60000)), sets: W.log };
  S.h.push(sum); S.n = (W.d + 1) % PROG.length; sel = null; save(); W = null; scr = 'done'; hap('ok');
}
function back() { ask('Выйти из тренировки? Результат не сохранится.', () => { W = null; scr = 'home'; tab = 'home'; render(); }); }
function seed() {
  const now = Date.now(), r = x => Math.round(x / 2.5) * 2.5;
  for (let i = 18; i >= 1; i--) {
    const d = PROG[i % 3], sets = [];
    d.ex.forEach(e => { for (let k = 0; k < e[1]; k++) sets.push({ n: e[0], w: r(e[3] * (1 - i * 0.008)), r: parseInt(e[2]) }); });
    S.h.push({ t: now - i * 2.4 * 864e5, d: d.name, v: sets.reduce((a, s) => a + s.w * s.r, 0), s: sets.length, dur: 60, sets });
  }
  S.h.sort((a, b) => a.t - b.t); save();
}

function tick() {
  const rt = document.getElementById('rt'); if (!rt || !W) return;
  const e = PROG[W.d].ex[W.i], n = W.log.filter(s => s.n === e[0]).length;
  const left = W.re ? Math.max(0, Math.ceil((W.re - Date.now()) / 1000)) : 0;
  let lab, txt, off = 0;
  if (W.re && left > 0) { lab = 'Отдых'; txt = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); off = 502.65 * (1 - left / W.rt); }
  else { if (W.re) { W.re = 0; hap('medium'); } lab = 'Подход'; txt = (n + 1) + '/' + e[1]; }
  document.getElementById('rl').textContent = lab; rt.textContent = txt;
  document.getElementById('rc').setAttribute('stroke-dashoffset', off);
}
setInterval(tick, 250);

document.getElementById('app').addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v; hap();
  if (a === 'tab') { tab = v; }
  else if (a === 'start') { return start(curDay()); }
  else if (a === 'pick') { sel = +v; tab = 'home'; }
  else if (a === 'w') { W.w = Math.max(0, Math.round((W.w + +v) * 10) / 10); }
  else if (a === 'r') { W.r = Math.max(1, W.r + +v); }
  else if (a === 'set') { doneSet(); }
  else if (a === 'rs') { if (W.re) { W.re += v * 1000; W.rt = Math.max(15, W.rt + +v); } }
  else if (a === 'skip') { W.re = 0; }
  else if (a === 'back') { return back(); }
  else if (a === 'per') { per = v; }
  else if (a === 'ok') { scr = 'home'; tab = 'home'; }
  else if (a === 'seed') { ask('Добавить демо-тренировки за последние недели?', () => { seed(); render(); }); return; }
  else if (a === 'reset') { ask('Удалить всю историю тренировок?', () => { S = { h: [], n: 0, w: {} }; sel = null; save(); render(); }); return; }
  render();
});
try { tg.BackButton.onClick(() => scr === 'work' && back()); } catch (e) {}
render();
</script>
</body>
</html>
